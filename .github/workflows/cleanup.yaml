name: Maintenance & Cleanup

on:
  workflow_dispatch: # Avvio manuale
  schedule:
    - cron: "0 23 * * *"

env:
  NUM_RELEASE_TENUTE: 10
  BUILD_TYPE: snapshot

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # Obbligatorio per eliminare i log dei workflow
    
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # --- 1. PULIZIA WORKFLOW FALLITI O VECCHI ---
      - name: Cleanup Failed and Old Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Eliminazione workflow falliti, cancellati o scaduti..."
          # Elimina tutti i run che non sono 'success' (failed, cancelled, timed_out)
          gh run delete --status failed --all
          gh run delete --status cancelled --all
          gh run delete --status skipped --all
          
          echo "📅 Eliminazione log di workflow più vecchi di 15 giorni..."
          gh run delete --created "<$(date -d '15 days ago' +%Y-%m-%d)" --all

      # --- 2. PULIZIA VECCHIE RELEASE ---
      - name: Delete Old Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Analisi release esistenti..."
          # Prende gli ID delle release che iniziano con BUILD_TYPE, saltando le prime N
          RELEASES_TO_DELETE=$(gh api repos/${{ github.repository }}/releases \
            | jq -r '.[] | select(.tag_name | startswith("${{ env.BUILD_TYPE }}-")) | .id' \
            | tail -n +$(( ${{ env.NUM_RELEASE_TENUTE }} + 1 )))

          if [ -z "$RELEASES_TO_DELETE" ]; then
            echo "✅ Nessuna release da eliminare."
          else
            for id in $RELEASES_TO_DELETE; do
              TAG=$(gh api repos/${{ github.repository }}/releases/$id | jq -r .tag_name)
              echo "🗑️ Eliminazione Release: $TAG (ID: $id)"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" || true
              sleep 1 # Evita rate-limiting
            done
          fi

      # --- 3. SINCRONIZZAZIONE GITHUB PAGES ---
      - name: Cleanup GitHub Pages Folders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recupera i timestamp delle release superstiti
          gh api repos/${{ github.repository }}/releases \
            | jq -r '.[] | select(.tag_name | startswith("${{ env.BUILD_TYPE }}-")) | .tag_name' \
            | sed -E "s/${{ env.BUILD_TYPE }}-([0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{4}).*/\1/" \
            > /tmp/valid_timestamps.txt

          echo "📦 Timestamp validi da mantenere:"
          cat /tmp/valid_timestamps.txt

          if [ -d "${{ env.BUILD_TYPE }}" ]; then
            echo "📂 Controllo cartelle in gh-pages/${{ env.BUILD_TYPE }}/..."
            cd "${{ env.BUILD_TYPE }}"
            
            # Ciclo sulle cartelle (es: 25-04-2026-2012/)
            for dir in */; do
              [ -e "$dir" ] || continue
              timestamp=${dir%/}
              
              if ! grep -q "$timestamp" /tmp/valid_timestamps.txt; then
                echo "🗑️ Rimoziene cartella orfana: $timestamp"
                rm -rf "$timestamp"
              else
                echo "✅ Cartella attiva: $timestamp"
              fi
            done
            cd ..
          fi

          # Commit delle modifiche su gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git commit -m "🧹 Maintenance: cleaned up old releases, pages and workflows"; then
            git push origin gh-pages
          else
            echo "Nothing changed on GitHub Pages."
          fi
