name: Maintenance & Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  maintenance:
    name: Cleanup ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    strategy:
      matrix:
        build_type: [snapshot, main]
      fail-fast: false

    steps:
      - name: Cleanup Releases & Workflows
        id: cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM_KEEP: 10
        run: |
          set -e

          TYPE="${{ matrix.build_type }}"
          echo "🧹 Cleanup per $TYPE"

          # =========================================================
          # 1. CLEANUP RELEASE (fonte di verità)
          # =========================================================
          RELEASES=$(gh release list --limit 100 \
            | grep "^$TYPE-" \
            | awk '{print $1}')

          KEEP_RELEASES=$(echo "$RELEASES" | head -n $NUM_KEEP)
          DELETE_RELEASES=$(echo "$RELEASES" | tail -n +$((NUM_KEEP+1)))

          for tag in $DELETE_RELEASES; do
            BODY=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || true)

            # skip KEEP
            if echo "$BODY" | grep -q "KEEP"; then
              echo "🛑 $tag ha flag KEEP"
              continue
            fi

            echo "🗑️ Processing $tag"

            # parse RUN ID
            RUN_ID=$(echo "$BODY" | sed -n 's/.*Job ID:\*\* \([0-9]\+\).*/\1/p')

            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$GITHUB_RUN_ID" ]; then
              echo "🔥 Cancello run $RUN_ID"
              gh run delete "$RUN_ID" || true
            fi

            # delete release
            gh release delete "$tag" --yes --cleanup-tag || true
          done

          # =========================================================
          # 2. CLEANUP RUNS (mantieni solo 10 success)
          # =========================================================
          echo "🔍 Cleanup runs $TYPE.yaml"

          RUN_DATA=$(gh run list --workflow "$TYPE.yaml" --limit 50 \
            --json databaseId,conclusion \
            | jq -r '.[] | "\(.databaseId) \(.conclusion)"')

          SUCCESS_RUNS=$(echo "$RUN_DATA" | grep " success$" | awk '{print $1}')
          KEEP_RUNS=$(echo "$SUCCESS_RUNS" | head -n 10)

          ALL_IDS=$(echo "$RUN_DATA" | awk '{print $1}')

          DELETE_RUNS=$(comm -23 \
            <(echo "$ALL_IDS" | sort) \
            <(echo "$KEEP_RUNS" | sort)
          )

          for run in $DELETE_RUNS; do
            if [ "$run" != "$GITHUB_RUN_ID" ]; then
              echo "🗑️ Cancello run $run"
              gh run delete "$run" || true
            fi
          done

          # =========================================================
          # 3. SNAPSHOT HARD CLEAN (workflows tecnici)
          # =========================================================
          if [ "$TYPE" = "snapshot" ]; then
            echo "💣 Cleanup totale workflows tecnici"

            for wf in "pages-build-deployment" "cleanup.yaml" "rebuild-index.yaml"; do
              RUNS=$(gh run list --workflow "$wf" --limit 100 \
                --json databaseId \
                --jq '.[].databaseId' 2>/dev/null || true)

              for r in $RUNS; do
                if [ "$r" != "$GITHUB_RUN_ID" ]; then
                  echo "🔥 Cancello $wf run $r"
                  gh run delete "$r" || true
                fi
              done
            done
          fi

      # =========================================================
      # 4. PULIZIA EFFETTIVA DELLA CARTELLA SU GH-PAGES
      # =========================================================
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Synchronize gh-pages folder with Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TYPE="${{ matrix.build_type }}"
          
          if [ ! -d "$TYPE" ]; then
            echo "Directory $TYPE non trovata su gh-pages."
            exit 0
          fi

          # 1. Recupera la lista dei tag delle release ancora esistenti
          EXISTING_TAGS=$(gh release list --limit 100 | grep "^$TYPE-" | awk '{print $1}')
          
          # 2. Raccogli i timestamp/folder autorizzati dalle release attive
          VALID_TARGETS=""
          for tag in $EXISTING_TAGS; do
            BODY=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || true)
            TS=$(echo "$BODY" | sed -n 's/.*Date:\*\* "\(.*\)".*/\1/p')
            if [ -n "$TS" ]; then
              VALID_TARGETS="$VALID_TARGETS $TS"
            fi
          done

          # 3. Elimina fisicamente dalla cartella snapshot/ ogni sotto-elemento non associato a una release valida
          echo "🧹 Verifico e pulisco $TYPE/..."
          cd "$TYPE"
          
          for item in *; do
            [ -e "$item" ] || continue
            
            if ! echo "$VALID_TARGETS" | grep -q -w "$item"; then
              echo "🗑️ Rimuovo elemento orfano: $item"
              rm -rf "$item"
            else
              echo "✅ Mantenuto: $item"
            fi
          done

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          if ! git diff --cached --quiet; then
            echo "🚀 Salvo le modifiche su gh-pages..."
            git commit -m "🧹 Cleanup automatico $TYPE basato sulle release attive"
            git push origin gh-pages
          else
            echo "✨ La directory $TYPE è già completamente pulita."
          fi
