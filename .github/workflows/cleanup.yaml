name: Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Cleanup releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          KEEP=10

          cleanup_releases() {

            TYPE="$1"

            echo "=== RELEASE CLEANUP [$TYPE] ==="

            TAGS=$(gh release list \
              --limit 1000 \
              --json tagName,createdAt \
              --jq '.[] | select(.tagName | startswith("'"$TYPE"'-")) | .tagName')

            COUNT=$(echo "$TAGS" | grep -c . || true)

            echo "Found: $COUNT"

            [ "$COUNT" -le "$KEEP" ] && return 0

            DELETE=$(echo "$TAGS" | tail -n +$((KEEP+1)))

            for tag in $DELETE
            do
              echo "Deleting $tag"
              gh release delete "$tag" \
                --yes \
                --cleanup-tag
            done
          }

          cleanup_releases snapshot
          cleanup_releases main

      - name: Cleanup workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          KEEP=10

          cleanup_runs() {

            WF="$1"

            echo "=== RUN CLEANUP [$WF] ==="

            RUNS=$(gh run list \
              --workflow "$WF" \
              --limit 1000 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion=="success") | .databaseId')

            COUNT=$(echo "$RUNS" | grep -c . || true)

            echo "Found: $COUNT"

            [ "$COUNT" -le "$KEEP" ] && return 0

            DELETE=$(echo "$RUNS" | tail -n +$((KEEP+1)))

            for run in $DELETE
            do
              if [ "$run" != "$GITHUB_RUN_ID" ]; then
                echo "Deleting run $run"
                gh run delete "$run"
              fi
            done
          }

          cleanup_runs snapshot.yaml
          cleanup_runs main.yaml

      - name: Cleanup snapshot folders
        run: |
          set -e
          
          KEEP=10
          
          find snapshot \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%T@ %p\n' \
            | sort -rn \
            | tail -n +$((KEEP+1)) \
            | cut -d' ' -f2- \
            | while read dir
              do
                echo "Removing $dir"
                rm -rf "$dir"
              done

      - name: Sync gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          sync_type() {

            TYPE="$1"

            [ ! -d "$TYPE" ] && return 0

            echo "=== SYNC [$TYPE] ==="

            ACTIVE=$(gh release list \
              --limit 1000 \
              --json tagName \
              --jq '.[] | select(.tagName | startswith("'"$TYPE"'-")) | .tagName')

            cd "$TYPE"

            for d in */
            do
              [ -d "$d" ] || continue

              DIR=${d%/}

              if ! echo "$ACTIVE" | grep -q "$DIR"
              then
                echo "Removing orphan: $DIR"
                rm -rf "$DIR"
              fi
            done

            cd ..
          }

          sync_type snapshot
          sync_type main

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

          git add .

          if git diff --cached --quiet
          then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Cleanup old releases and builds"
          git push