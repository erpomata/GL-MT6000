name: Maintenance & Cleanup

on:
  workflow_dispatch: # Avvio manuale
  schedule:
    - cron: "0 23 * * *" # Ogni notte alle 23:00 UTC

jobs:
  maintenance:
    name: Cleanup ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    strategy:
      matrix:
        build_type: [snapshot, main]
      fail-fast: false # Se uno fallisce, l'altro continua

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Cleanup Specialized (Runs, Releases and Files)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM_RELEASE_TENUTE: 10
        run: |
          echo "🧹 Avvio pulizia selettiva per il tipo: ${{ matrix.build_type }}"

          # 1. PULIZIA WORKFLOW RUNS (Solo quelli falliti/annullati del proprio tipo)
          # Specifichiamo il file workflow relativo al build_type
          echo "🔍 Pulizia log workflow per ${{ matrix.build_type }}.yaml"
          # 1. Recuperiamo le ultime 50 run concluse (sia success che cancelled)
          # 1. Chiediamo un limite alto (es. 50) per scansionare lo storico recente
          echo "🔍 Analisi delle ultime run per identificare i controlli a vuoto..."
          RUNS=$(gh run list --workflow "${{ matrix.build_type }}.yaml" --limit 50 --json databaseId,conclusion \
            | jq -r '.[] | select(.conclusion=="success" or .conclusion=="cancelled") | .databaseId')

          # Inizializziamo un contatore per contare quante build REALI (andate a buon fine) vogliamo tenere
          BUILD_REALI_TENUTE=0
          LIMITE_TENUTE="${{ env.NUM_RELEASE_TENUTE }}" # Assicurati che sia una variabile d'ambiente o usa la tua sintassi

          if [ -n "$RUNS" ]; then
            for run_id in $RUNS; do
              # Salvaguardia: non toccare la run corrente
              if [ "$run_id" = "${{ github.run_id }}" ]; then continue; fi

              # Controlliamo lo stato del job 'build'
              BUILD_CONCLUSION=$(gh api repos/${{ github.repository }}/actions/runs/$run_id/jobs --jq '.jobs[] | select(.name=="build") | .conclusion' 2>/dev/null || echo "")

              if [ "$BUILD_CONCLUSION" = "success" ]; then
                # È una build reale andata a buon fine!
                BUILD_REALI_TENUTE=$((BUILD_REALI_TENUTE + 1))
              
                if [ "$BUILD_REALI_TENUTE" -le "$LIMITE_TENUTE" ]; then
                  echo "🟢 Run $run_id è una delle ultime $LIMITE_TENUTE build reali. La conservo."
                  continue
                fi
              fi

              # Se il job 'build' è 'skipped' (controllo a vuoto) OPPURE se è una build reale success
              # ma abbiamo già superato il numero massimo di release da tenere, allora si cancella.
              if [ "$BUILD_CONCLUSION" = "skipped" ] || [ -z "$BUILD_CONCLUSION" ] || [ "$BUILD_REALI_TENUTE" -gt "$LIMITE_TENUTE" ]; then
                echo "🗑️ Eliminazione run ID: $run_id (Stato build: ${BUILD_CONCLUSION:-annullata / vecchia})"
               gh run delete "$run_id" || true
              fi
          done
        else
          echo "✅ Nessuna run trovata nel raggio d'azione."
        fi

          #Lo faccio solo per snapshot altrimenti lo fanno iparallelo due processi e si richiano casini
          if [ "${{ matrix.build_type }}" == "snapshot" ]; then
              
              # =========================================================
              # 1. Recupera la lista delle run rebuild-index.yaml
              # =========================================================
              RUNS_INDEX=$(gh run list --workflow rebuild-index.yaml --limit 100 --json databaseId --jq '.[].databaseId' --repo "$GITHUB_REPOSITORY")

              if [ -n "$RUNS_INDEX" ]; then
                COUNT_INDEX=$(echo "$RUNS_INDEX" | wc -l | xargs)
                echo "🗑️ Trovate $COUNT_INDEX run di rebuild-index da eliminare. Inizio..."
                
                echo "$RUNS_INDEX" | xargs -P 4 -I {} sh -c 'echo "Eliminazione run ID: {}" && gh run delete "{}" --repo "'"$GITHUB_REPOSITORY"'" || true'
              else
                echo "✅ Nessun run da eliminare per il workflow rebuild-index.yaml."
              fi
          
              # =========================================================
              # 2. Recupera la lista delle run cleanup.yaml (Questo workflow)
              # =========================================================
              RUNS_CLEANUP=$(gh run list --workflow cleanup.yaml --limit 100 --json databaseId --jq '.[].databaseId' --repo "$GITHUB_REPOSITORY")

              if [ -n "$RUNS_CLEANUP" ]; then
                # Rimuoviamo l'ID della run corrente ($GITHUB_RUN_ID) dalla lista usando grep -v
                # L'opzione -w cerca la parola esatta per evitare falsi positivi parziali
                RUNS_CLEANUP_FILTERED=$(echo "$RUNS_CLEANUP" | grep -v -w "$GITHUB_RUN_ID" || true)
                
                if [ -n "$RUNS_CLEANUP_FILTERED" ]; then
                  COUNT_CLEAN_FILT=$(echo "$RUNS_CLEANUP_FILTERED" | wc -l | xargs)
                  echo "🗑️ Trovate $COUNT_CLEAN_FILT run di cleanup da eliminare. Inizio..."
                  
                  echo "$RUNS_CLEANUP_FILTERED" | xargs -P 4 -I {} sh -c 'echo "Eliminazione run ID: {}" && gh run delete "{}" --repo "'"$GITHUB_REPOSITORY"'" || true'
                else
                  echo "⏭️ Trovata solo la run corrente di cleanup.yaml. Salto la cancellazione."
                fi
              else
                echo "✅ Nessun run da eliminare per cleanup.yaml."
              fi

              # =========================================================
              # 3. Recupera la lista delle run pages-build-deployment
              # =========================================================
              RUNS_CLEANUP=$(gh run list --workflow pages-build-deployment --limit 100 --json databaseId --jq '.[].databaseId' --repo "$GITHUB_REPOSITORY")

              if [ -n "$RUNS_CLEANUP" ]; then
                  COUNT_CLEAN_FILT=$(echo "$RUNS_CLEANUP" | wc -l | xargs)
                  echo "🗑️ Trovate $COUNT_CLEAN_FILT run di cleanup da eliminare. Inizio..."
                  
                  echo "$RUNS_CLEANUP" | xargs -P 4 -I {} sh -c 'echo "Eliminazione run ID: {}" && gh run delete "{}" --repo "'"$GITHUB_REPOSITORY"'" || true'
              else
                echo "✅ Nessun run da eliminare per cleanup.yaml."
              fi
          fi

          # 2. PULIZIA RELEASES (Solo quelle che iniziano con main- o snapshot-)
          echo "📦 Analisi release per il prefisso: ${{ matrix.build_type }}-"
          # Prende la lista, filtra per prefisso, salta le ultime N e cancella le restanti
          RELEASES_TO_DELETE=$(gh release list --limit 100 | grep "^${{ matrix.build_type }}-" | awk '{print $1}' | tail -n +$((NUM_RELEASE_TENUTE + 1)))
          
          if [ -n "$RELEASES_TO_DELETE" ]; then
            for tag in $RELEASES_TO_DELETE; do
              echo "🗑️ Eliminazione release e tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
          else
            echo "✅ Le release sono già ottimizzate (meno di $NUM_RELEASE_TENUTE)."
          fi

          # 3. PULIZIA CARTELLE LOCALI (gh-pages/main o gh-pages/snapshot)
          if [ -d "${{ matrix.build_type }}" ]; then
            echo "📂 Gestione file in gh-pages/${{ matrix.build_type }}/"
            # Cancella i file più vecchi di 30 giorni nella cartella specifica
            find "${{ matrix.build_type }}" -type f -mtime +30 -delete
            echo "✅ Pulizia cartella locale completata."
          else
            echo "⚠️ Cartella ${{ matrix.build_type }} non trovata, salto questo step."
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Controllo se ci sono cambiamenti prima di fare il commit
          if ! git diff --quiet --exit-code --cached; then
            git commit -m "🧹 Cleanup automatico: pulizia ${{ matrix.build_type }}"
            # Pull rebase per evitare conflitti se i due job matrix scrivono contemporaneamente
            git pull --rebase origin gh-pages
            git push origin gh-pages
          else
            echo "✨ Nulla da pulire nel repository locale."
          fi
