name: OpenWrt MT6000 SNAPSHOT

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"   # ogni domenica alle 03:00

env:
  REPO: pesa1234/openwrt
  CONFIG_FILE: mt6000.config
  REPO_DIR: snapshot
  BUILD_TYPE: snapshot

jobs:

  # 🔍 JOB 1: controlla se ci sono nuovi commit
  check:
    runs-on: ubuntu-22.04
    outputs:
      branch: ${{ steps.detect.outputs.branch }}
      commit: ${{ steps.detect.outputs.commit }}
      build: ${{ steps.detect.outputs.build }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache jq # aggiungi ccache qui
          sudo apt autoremove -y && sudo apt clean -y

      - name: Detect latest branch
        id: detect
        run: |
          set -e

          # 🔎 Trova ultimo branch next-*
          BRANCH=$(git ls-remote https://github.com/${{ env.REPO }}.git "refs/heads/next-*" \
            | sed -e 's|.*refs/heads/||' \
            | grep -viE 'test|beta' \
            | sort -V | tail -n1)

          # fallback su main se non trovato
          [ -z "$BRANCH" ] && BRANCH="main"

          # 🧠 recupera commit SHA
          COMMIT=$(git ls-remote https://github.com/${{ env.REPO }}.git refs/heads/$BRANCH | awk '{print $1}')

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

          # 📦 controlla ultima release
          LAST=$(gh api repos/${{ github.repository }}/releases/latest --jq .body 2>/dev/null || echo "")

          # 🔁 decide se buildare
          if echo "$LAST" | grep -q "$COMMIT"; then
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

  # 🏗️ JOB 2: build vera e propria
  build:
    needs: check
    if: needs.check.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      # 📥 checkout del repo con la config
      - uses: actions/checkout@v5

      # 🔧 installa dipendenze
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
          zlib1g-dev file wget curl ccache jq

      # 📦 clona repo pesa con branch automatico
      - name: Clone OpenWrt ${{ env.REPO_DIR }}
        run: |
          rm -rf ${{ env.REPO_DIR }}
          git clone https://github.com/${{ env.REPO }}.git ${{ env.REPO_DIR }}
          cd ${{ env.REPO_DIR }}
          git checkout ${{ needs.check.outputs.branch }}

      # ⚡ cache per velocizzare le build successive
      - name: Cache
        uses: actions/cache@v5.0.4
        with:
          path: ${{ env.REPO_DIR }}/.ccache
          # La chiave include il branch e il commit della config per invalidarla se necessario
          key: ccache-${{ needs.check.outputs.branch }}-${{ hashFiles(env.CONFIG_FILE) }}
          restore-keys: |
            ccache-${{ needs.check.outputs.branch }}-

      # 📦 aggiorna feeds
      - name: Update feeds
        run: |
          cd ${{ env.REPO_DIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Checkout mio repository
        uses: actions/checkout@v6.0.2
        with:
         path: "builder_repo"

      # ⚙️ applica configurazione personalizzata
      - name: Apply config
        run: |
          cp ${{ env.CONFIG_FILE }} ${{ env.REPO_DIR }}/.config
          cp .github/workflows/snapshot.yaml ${{ env.REPO_DIR }}/

          # inizializza variabile
          PATCH_STATUS="applied"

          # patcha senza cambiare cartella
          rm -frv builder_repo/.git builder_repo/.github
          for file in $(grep -rl XXXXXX builder_repo/); do
              echo "Patching: $file"
              cp "$file" "${file}.bak"
              sed -i "s|XXXXXX/YYYYYY|${GITHUB_REPOSITORY}|g" "$file" || exit 1
              diff "${file}.bak" "$file" || true  # <--- Forza il successo
          done

          if [ -f builder_repo/attendedsysupgrade-with-GitHub.patch ]; then
              cd ${{ env.REPO_DIR }}
              if ! patch -p1 --forward < ../builder_repo/attendedsysupgrade-with-GitHub.patch; then
                  PATCH_STATUS="skipped"
                  echo "⚠️ Patch non applicata"
              else
                  echo "✅ Patch applicata"
              fi
              cd ..
          else
            echo "⚠️ Patch non trovata, procedo comunque"
            PATCH_STATUS="missing"
          fi

          echo "PATCH_STATUS=$PATCH_STATUS" >> $GITHUB_ENV

          mv -v builder_repo/files ${{ env.REPO_DIR }}/
          chmod -v 755 ${{ env.REPO_DIR }}/files/usr/bin/upgrade_custom_openwrt ${{ env.REPO_DIR }}/files/www/cgi-bin/github_*

          cd ${{ env.REPO_DIR }}

          # Rimuove definizioni esistenti per evitare duplicati
          sed -i '/CONFIG_VERSION_NUMBER/d' .config
          sed -i '/CONFIG_VERSION_CODE/d' .config
          
          # Usa la variabile BUILD_TYPE definita in cima al file
          echo 'CONFIG_VERSION_NUMBER="${{ env.BUILD_TYPE }}"' >> .config
          
          # Aggiunge la data per rendere il file unico (es. snapshot-2026-04-10)
          echo "CONFIG_VERSION_CODE=\"$(date +%Y-%m-%d)\"" >> .config

          make defconfig

      # 🚫 rimuove pacchetti problematici
      - name: Clean problematic packages
        run: |
          cd ${{ env.REPO_DIR }}
          sed -i '/fwupd/d' .config || true
          sed -i '/kmod-nvidia/d' .config || true
          sed -i '/kmod-vbox/d' .config || true
          sed -i '/python3-pkg-resources/d' .config || true
          make defconfig

      # 🔧 toolchain (compilatori ecc.)
      - name: Build toolchain
        run: |
          cd ${{ env.REPO_DIR }}
          make -j$(nproc) tools/install toolchain/install

      # 🎯 build firmware
      - name: Build firmware
        run: |
          cd ${{ env.REPO_DIR }}
          make -j$(nproc) || make -j1 V=s

      # 📦 build pacchetti (continua anche con errori)
      #- name: Build packages
      #  run: |
      #    cd ${{ env.REPO_DIR }}
      #    make -k -j$(nproc) package/compile

      # 📚 genera repository opkg
      - name: Generate repo
        run: |
          cd ${{ env.REPO_DIR }}
          make package/index

      # 📦 prepara file release
      - name: Prepare release
        run: |
          cd ${{ env.REPO_DIR }}
 
          DATE=$(date +%Y-%m-%d)
          COMMIT=${{ needs.check.outputs.commit }}
          SHORT=${COMMIT:0:7}
          
          mkdir -p release/firmware
          mkdir -p release/packages
          
          #echo "📂 Contenuto di: "${{ env.REPO_DIR }}
          #ls -R || true
          
          # =========================
          # 🔥 FIRMWARE
          # =========================
          # Cerchiamo in modo ricorsivo qualsiasi file che finisca per sysupgrade.bin
          FILES=$(find . -name "*sysupgrade.bin" 2>/dev/null)
          
          if [ -z "$FILES" ]; then
            echo "❌ Nessun firmware sysupgrade trovato!"
            echo "📂 Debug struttura attuale:"
            find . -maxdepth 4
            exit 1
          else
            echo "✅ Firmware trovato:"
            echo "$FILES"
            # Copiamo mantenendo la struttura o solo i file
            find . -name "*sysupgrade.bin" -exec cp {} release/firmware/ \;
            # Copiamo anche i file di log/info se presenti nella stessa cartella
            TARGET_DIR=$(dirname $(echo "$FILES" | head -n1))
            cp -r $TARGET_DIR/* release/firmware/ 2>/dev/null || true
          fi
          
          # =========================
          # 📦 PACKAGES
          # =========================
          PKG_PATH=$(find . -type d -path "*/packages/*" | head -n1)
          if [ -z "$PKG_PATH" ]; then
            echo "❌ Nessun pacchetto trovato!"
            ls -R bin || true
            exit 1
          fi

          
          echo "📦 Copio pacchetti da: $PKG_PATH"
          cp -r $PKG_PATH/* release/packages/
          
          # rigenera index opkg
          cd release/packages
          ../../scripts/ipkg-make-index.sh . > Packages
          gzip -f Packages
          cd ../..
          
          # =========================
          # 📦 ARCHIVIO
          # =========================
          cd release
          tar -czf packages.tar.gz packages
          
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "SHORT=$SHORT" >> $GITHUB_ENV

      # 🚀 pubblica release
      - name: Publish release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ env.BUILD_TYPE }}-${{ env.DATE }}-${{ env.SHORT }}
          name: SNAPSHOT ${{ env.DATE }}
          body: |
            Branch: ${{ needs.check.outputs.branch }}
            Commit: ${{ needs.check.outputs.commit }}
          files: |
            ${{ env.REPO_DIR }}/release/firmware/**
            ${{ env.REPO_DIR }}/release/packages.tar.gz
            ${{ env.REPO_DIR }}/mt6000.config
            ${{ env.REPO_DIR }}/snapshot.yaml   # se l'hai copiato

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧹 pulizia vecchie release (mantiene le ultime 10)
      - name: Clean old releases
        run: |
          echo "🧹 Cleaning old releases..."
          gh api repos/${{ github.repository }}/releases \
            | jq -r '.[] | select(.tag_name | startswith("${{ env.BUILD_TYPE }}-")) | "\(.id) \(.tag_name)"' \
            | tail -n +11 \
            | while read id tag; do
                echo "Deleting release $tag"
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
                gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
              done
      
      - name: Deploy to GitHub Pages
        run: |
          mkdir -p public/${{ env.BUILD_TYPE }}

          # 1. Copia i file di indice (cerca sia con p minuscola che maiuscola per sicurezza)
          # -iname "packages*" troverà packages.adb, Packages.adb, packages.gz, ecc.
          find ${{ env.REPO_DIR }}/bin -iname "packages*" -exec cp -v {} public/${{ env.BUILD_TYPE }}/ \;

          # 2. Copia i pacchetti reali (apk o ipk)
          find ${{ env.REPO_DIR }}/bin -name "*.apk" -exec cp -v {} public/${{ env.BUILD_TYPE }}/ \;
          find ${{ env.REPO_DIR }}/bin -name "*.ipk" -exec cp -v {} public/${{ env.BUILD_TYPE }}/ \;

          # 3. Genera l'index.html per vedere i file nel browser
          cd public/${{ env.BUILD_TYPE }}
          # Usiamo BUILD_TYPE nel titolo per coerenza
          echo "<html><head><title>Index of ${{ env.BUILD_TYPE }}</title></head><body>" > index.html
          echo "<h1>OpenWrt Packages - ${{ env.BUILD_TYPE }}</h1><hr><ul>" >> index.html
          
          # Generiamo la lista file in modo pulito
          ls -1 | grep -v "index.html" | while read f; do
            echo "<li><a href=\"$f\">$f</a></li>" >> index.html
          done
          
          echo "</ul><hr><p>Generated on $(date)</p></body></html>" >> index.html
      
      - name: Publish Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      # 📧 invio email in caso di successo
      - name: Send email
        if: success()
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: OpenWrt ${{ env.BUILD_TYPE }} Build SUCCESS
          body: |
            ✅ Build completata

            🔗 Release:
            ${{ github.server_url }}/${{ github.repository }}/releases

            🔗 Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ⚠️ Patch status: ${{ env.PATCH_STATUS }}
          to: ${{ secrets.MAIL_USER }}
          from: OpenWrt CI <${{ secrets.MAIL_USER }}>

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: failure()
